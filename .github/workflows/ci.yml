# OrbitSwap Pro - CI/CD Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  RUST_VERSION: "nightly"

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build

  # ─── Smart Contracts ──────────────────────────────────────────────────
  contract-router:
    name: Contract Router
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: rustup target add wasm32v1-none
      - run: cargo build --target wasm32v1-none --release
        working-directory: contracts/router
      - run: cargo test
        working-directory: contracts/router

  contract-liquidity-pool:
    name: Contract LP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: rustup target add wasm32v1-none
      - run: cargo build --target wasm32v1-none --release
        working-directory: contracts/liquidity_pool
      - run: cargo test
        working-directory: contracts/liquidity_pool

  contract-fee-vault:
    name: Contract FeeVault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: rustup target add wasm32v1-none
      - run: cargo build --target wasm32v1-none --release
        working-directory: contracts/fee_vault
      - run: cargo test
        working-directory: contracts/fee_vault

  contract-treasury:
    name: Contract Treasury
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: rustup target add wasm32v1-none
      - run: cargo build --target wasm32v1-none --release
        working-directory: contracts/treasury
      - run: cargo test
        working-directory: contracts/treasury

  contract-swap-registry:
    name: Contract SwapRegistry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: rustup target add wasm32v1-none
      - run: cargo build --target wasm32v1-none --release
        working-directory: contracts/swap_registry
      - run: cargo test
        working-directory: contracts/swap_registry

  contract-event:
    name: Contract Event
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: rustup target add wasm32v1-none
      - run: cargo build --target wasm32v1-none --release
        working-directory: contracts/event
      - run: cargo test
        working-directory: contracts/event

  # ─── Quality Gate ─────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - contract-router
      - contract-liquidity-pool
      - contract-fee-vault
      - contract-treasury
      - contract-swap-registry
      - contract-event
    if: always()
    steps:
      - run: |
          echo "=== Quality Gate ==="
          echo "Frontend Lint:    ${{ needs.frontend-lint.result }}"
          echo "Frontend Type:    ${{ needs.frontend-typecheck.result }}"
          echo "Frontend Tests:   ${{ needs.frontend-test.result }}"
          echo "Frontend Build:   ${{ needs.frontend-build.result }}"
          echo "Router:           ${{ needs.contract-router.result }}"
          echo "LiquidityPool:    ${{ needs.contract-liquidity-pool.result }}"
          echo "FeeVault:         ${{ needs.contract-fee-vault.result }}"
          echo "Treasury:         ${{ needs.contract-treasury.result }}"
          echo "SwapRegistry:     ${{ needs.contract-swap-registry.result }}"
          echo "Event:            ${{ needs.contract-event.result }}"
          echo "=================="
          
          FAILED=false
          for job in \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-typecheck.result }}" \
            "${{ needs.frontend-test.result }}" \
            "${{ needs.frontend-build.result }}" \
            "${{ needs.contract-router.result }}" \
            "${{ needs.contract-liquidity-pool.result }}" \
            "${{ needs.contract-fee-vault.result }}" \
            "${{ needs.contract-treasury.result }}" \
            "${{ needs.contract-swap-registry.result }}" \
            "${{ needs.contract-event.result }}"; do
            if [ "$job" != "success" ]; then
              FAILED=true
            fi
          done
          
          if [ "$FAILED" = "true" ]; then
            echo "❌ Some jobs failed"
            exit 1
          else
            echo "✅ All 10 jobs passed!"
            exit 0
          fi
