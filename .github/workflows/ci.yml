# OrbitSwap Pro - CI/CD Pipeline
#
# Automates: install, lint, typecheck, frontend tests, contract build, contract tests

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  RUST_VERSION: "nightly-2026-07-25"

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend (${{ matrix.command }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: [lint, typecheck, test, build]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci
      - run: npm run ${{ matrix.command }}

  # ─── Smart Contracts ──────────────────────────────────────────────────
  contracts:
    name: Contracts (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        contract:
          - router
          - liquidity_pool
          - fee_vault
          - treasury
          - swap_registry
          - event

    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32v1-none

      - name: Build ${{ matrix.contract }}
        working-directory: contracts/${{ matrix.contract }}
        run: cargo build --target wasm32v1-none --release

      - name: Test ${{ matrix.contract }}
        working-directory: contracts/${{ matrix.contract }}
        run: cargo test

  # ─── Quality Gate ─────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend, contracts]
    if: always()
    steps:
      - run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Contracts: ${{ needs.contracts.result }}"
          [ "${{ needs.frontend.result }}" = "success" ] && [ "${{ needs.contracts.result }}" = "success" ] && exit 0 || exit 1
