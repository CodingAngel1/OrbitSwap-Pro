# OrbitSwap Pro - CI/CD Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Frontend ──────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run lint

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run test:run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run build

  # ─── Smart Contracts (Test on native target) ──────────────────────────
  contract-tests:
    name: Contract ${{ matrix.contract }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        contract:
          - router
          - liquidity_pool
          - fee_vault
          - treasury
          - swap_registry
          - event
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Test ${{ matrix.contract }}
        working-directory: contracts/${{ matrix.contract }}
        run: cargo test

  # ─── WASM Build (optional) ────────────────────────────────────────────
  contract-wasm:
    name: Contract WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32v1-none
      - name: Build WASM
        run: |
          for contract in router liquidity_pool fee_vault treasury swap_registry event; do
            echo "Building $contract..."
            cd contracts/$contract
            cargo build --target wasm32v1-none --release && echo "✅ $contract built" || echo "⚠️ $contract build skipped"
            cd ../..
          done

  # ─── Quality Gate ─────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - contract-tests
    if: always()
    steps:
      - run: |
          echo "=== Quality Gate ==="
          echo "Frontend Lint:    ${{ needs.frontend-lint.result }}"
          echo "Frontend Type:    ${{ needs.frontend-typecheck.result }}"
          echo "Frontend Tests:   ${{ needs.frontend-test.result }}"
          echo "Frontend Build:   ${{ needs.frontend-build.result }}"
          echo "Contract Tests:   ${{ needs.contract-tests.result }}"
          [ "${{ needs.frontend-lint.result }}" = "success" ] && \
          [ "${{ needs.frontend-typecheck.result }}" = "success" ] && \
          [ "${{ needs.frontend-test.result }}" = "success" ] && \
          [ "${{ needs.frontend-build.result }}" = "success" ] && \
          [ "${{ needs.contract-tests.result }}" = "success" ] && \
          echo "✅ All jobs passed!" && exit 0 || \
          echo "❌ Some jobs failed" && exit 1
