[package]
name = "orbitswap-swap-registry"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
debug = 0
strip = "symbols"

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
