<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>OrbitSwap Pro - Decentralized Exchange on Stellar</title>
    <meta
      name="title"
      content="OrbitSwap Pro - Decentralized Exchange on Stellar"
    />
    <meta
      name="description"
      content="OrbitSwap Pro is a production-ready decentralized exchange built on the Stellar Network enabling secure token swaps, liquidity provision, and real-time market monitoring."
    />
    <meta
      name="keywords"
      content="stellar, soroban, dex, decentralized exchange, crypto, blockchain, defi, swap, trade"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://orbitswap.pro/" />
    <meta property="og:title" content="OrbitSwap Pro - Decentralized Exchange on Stellar" />
    <meta
      property="og:description"
      content="Production-grade decentralized trading powered by Stellar."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://orbitswap.pro/" />
    <meta property="twitter:title" content="OrbitSwap Pro - Decentralized Exchange on Stellar" />
    <meta
      property="twitter:description"
      content="Production-grade decentralized trading powered by Stellar."
    />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />

    <!-- Preconnect to Stellar networks -->
    <link rel="preconnect" href="https://horizon-testnet.stellar.org" />
    <link rel="preconnect" href="https://soroban-testnet.stellar.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

      <div

          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #030712;
          color: #f9fafb;
          font-family: system-ui, sans-serif;
          padding: 20px;
          text-align: center;
        "
      >
        <div>
          <h1 style="font-size: 24px; margin-bottom: 8px">
            OrbitSwap Pro
          </h1>
          <p style="color: #9ca3af; font-size: 14px">

          </p>
        </div>
      </div>
